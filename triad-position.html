<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Triad Position Finder — Chords by Fretboard Region</title>
  <meta name="description" content="Find every diatonic triad in a key that falls within a chosen neighbourhood of the fretboard. Pick a key and a 4-fret region from the nut to the 15th fret, and see all triads and inversions playable there.">
  <meta name="theme-color" content="#0f0e0c">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f0e0c'/%3E%3Cline x1='9' y1='6' x2='9' y2='26' stroke='%235a5040' stroke-width='1.5'/%3E%3Cline x1='16' y1='6' x2='16' y2='26' stroke='%235a5040' stroke-width='1.5'/%3E%3Cline x1='23' y1='6' x2='23' y2='26' stroke='%235a5040' stroke-width='1.5'/%3E%3Cline x1='9' y1='8' x2='23' y2='8' stroke='%233a362c' stroke-width='1.5'/%3E%3Cline x1='9' y1='16' x2='23' y2='16' stroke='%233a362c' stroke-width='1.5'/%3E%3Cline x1='9' y1='24' x2='23' y2='24' stroke='%233a362c' stroke-width='1.5'/%3E%3Ccircle cx='9' cy='12' r='2.6' fill='%23c9a84c'/%3E%3Ccircle cx='16' cy='20' r='2.6' fill='%23c9a84c'/%3E%3Ccircle cx='23' cy='8' r='2.6' fill='%23c9a84c'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    html {
      zoom: 1.1;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(201, 168, 76, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(139, 94, 60, 0.06) 0%, transparent 50%);
    }

    /* footer's align-self:stretch (needed because this page's body is a
       centering flexbox) comes from theme.css. */

    .controls {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px 32px;
      border-radius: 4px;
      width: 100%;
      max-width: 900px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 140px;
    }

    .control-group.control-key {
      flex: 0 1 300px;
    }

    .control-group.control-region {
      flex: 0 1 340px;
    }

    .control-group.control-key label,
    .control-group.control-region label {
      text-align: center;
    }

    /* A bare `label {}` rule used to live here, but .control-group label
       from theme.css (a more specific selector) always wins for every label
       on this page — they're all inside a .control-group — so it never had
       any effect. Removed rather than promoted. */

    /* #key-label, #chord-row, .chord-card (base — this page adds max-width
       below), @keyframes fadeUp, .chord-name, .chord-numeral, .inversion-row
       (base — this page adds flex-wrap below), .inversion-item, svg.chord-svg,
       and .no-chord come from theme.css (shared with chords.html).
       #region-label and .chord-inversion stay local since they're either
       page-specific (id) or differ slightly between the two pages. */

    #region-label {
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .chord-card {
      max-width: 420px;
    }

    .chord-inversion {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: #5a5040;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.5;
    }

    .chord-inversion .voicing-strings {
      color: var(--amber);
    }

    .inversion-row {
      flex-wrap: wrap;
    }

    .legend {
      margin-top: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px 28px;
      border-radius: 4px;
      max-width: 500px;
      width: 100%;
    }

    .legend h3 {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .legend-dot.root { background: var(--amber); }
    .legend-dot.third { background: #6a9fb5; }
    .legend-dot.fifth { background: #8b5e3c; }

    /* ── Circle of fifths (key selector) ─────────────────────────────────────── */

    .circle-container {
      display: flex;
      justify-content: center;
    }

    #circle-of-fifths {
      width: 100%;
      max-width: 280px;
      height: auto;
    }

    /* .circle-segment's base + major/minor hover/selected states, and
       .circle-text, come from theme.css. */

    /* ── Fret region picker ──────────────────────────────────────────────────── */

    .region-picker {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .region-picker .neck-wrap {
      position: relative;
      margin: 0 auto;
      max-width: 300px;
      width: 100%;
    }

    .region-picker svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .region-segment {
      cursor: pointer;
    }

    .region-segment rect.region-fill {
      fill: transparent;
      transition: fill 0.15s ease;
    }

    .region-segment:hover rect.region-fill {
      fill: rgba(201, 168, 76, 0.18);
    }

    .region-segment.selected rect.region-fill {
      fill: rgba(201, 168, 76, 0.32);
    }

    .region-segment text {
      fill: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      text-anchor: middle;
      pointer-events: none;
      transition: fill 0.15s ease;
    }

    .region-segment.selected text {
      fill: var(--amber);
    }

    .region-picker .readout {
      margin-top: 8px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      min-height: 20px;
    }

    .region-picker .readout .value {
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: var(--amber);
    }
  </style>
</head>

<body>
  <a href="index.html" class="back-link">&larr; Toolkit Home</a>

  <header>
    <h1>Triads by Position</h1>
    <p>Find every triad in a key, within reach of your hand</p>
  </header>

  <div class="controls">
    <div class="control-group control-key">
      <label>Key</label>
      <div class="circle-container">
        <svg id="circle-of-fifths" width="400" height="400" viewBox="0 0 400 400"></svg>
      </div>
    </div>
    <div class="control-group control-region">
      <label>Fretboard Region</label>
      <div class="region-picker">
        <div class="neck-wrap">
          <svg id="neck" viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg">

            <!-- ===== neck base ===== -->
            <rect x="20" y="25" width="260" height="30" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

            <!-- ===== fret ticks ===== -->
            <g id="fretTicks"></g>

            <!-- ===== position markers ===== -->
            <g id="positionMarkers"></g>

            <!-- ===== nut ===== -->
            <rect x="15" y="20" width="5" height="40" fill="var(--cream)"/>

            <!-- ===== region overlays (clickable) ===== -->
            <g id="regions"></g>

          </svg>
        </div>
        <div class="readout">
          <span class="value" id="regionReadout">Open – 3rd fret</span>
        </div>
      </div>
    </div>
  </div>

  <div id="key-label"></div>
  <div id="region-label"></div>
  <div id="chord-row"></div>

  <div class="legend">
    <h3>Legend</h3>
    <div class="legend-item">
      <div class="legend-dot root"></div>
      <span>Root (R)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot third"></div>
      <span>Third (3)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot fifth"></div>
      <span>Fifth (5)</span>
    </div>
  </div>

  <footer>Designed by Jon Thornton. Implemented by Claude.</footer>

  <script src="lib/svg-utils.js"></script>
  <script src="lib/theory.js"></script>
  <script src="lib/triads.js"></script>
  <script src="lib/circle-of-fifths.js"></script>
  <script>
    // ── Note helpers ──────────────────────────────────────────────────────────────
    // NOTES, LETTERS, LETTER_SEMITONE, and noteIndex come from theory.js.
    // spellScale and chooseBestRoot come from lib/triads.js.

    // ── Circle of Fifths (Key selector) ──────────────────────────────────────────
    // KEYSTR_MAP comes from lib/triads.js.
    // MAJOR_KEYS, MINOR_KEYS, and renderCircleOfFifths come from
    // circle-of-fifths.js. getPosition, createArcPath, and createSVGElement
    // come from svg-utils.js.

    let selectedKey = 'C';
    let selectedKeyType = 'major';

    function renderCircle() {
      renderCircleOfFifths({
        selectedKey,
        selectedKeyType,
        onSelect: (name, type) => selectKey(name, type),
      });
    }

    function selectKey(keyName, keyType) {
      selectedKey = keyName;
      selectedKeyType = keyType;
      renderCircle();
      generate();
    }

    // ── Fret region picker ───────────────────────────────────────────────────────

    const REGIONS = [
      { lo: 0, hi: 3, label: 'Open – 3rd' },
      { lo: 4, hi: 7, label: '4th – 7th' },
      { lo: 8, hi: 11, label: '8th – 11th' },
      { lo: 12, hi: 15, label: '12th – 15th' }
    ];

    let selectedRegion = REGIONS[0];

    (function () {
      const NECK_X0 = 20, NECK_X1 = 280, NUT_X = 20;
      const NECK_Y0 = 25, NECK_Y1 = 55;
      const TOTAL_FRETS = 15;

      function fretX(i) {
        return NECK_X0 + (NECK_X1 - NECK_X0) * (i / TOTAL_FRETS);
      }

      // Fret tick lines
      const ticksGroup = document.getElementById('fretTicks');
      for (let i = 1; i <= TOTAL_FRETS; i++) {
        const x = fretX(i);
        ticksGroup.appendChild(createSVGElement('line', {
          x1: x, y1: NECK_Y0, x2: x, y2: NECK_Y1,
          stroke: 'var(--border)',
          'stroke-width': i === TOTAL_FRETS ? 1.5 : 1
        }));
      }

      // Position markers (single dot: frets 3, 5, 7, 9, 15 — double: fret 12)
      const markerGroup = document.getElementById('positionMarkers');
      function cellCenter(i) {
        return (fretX(i - 1) + fretX(i)) / 2;
      }
      function addDot(cx, cy) {
        markerGroup.appendChild(createSVGElement('circle', {
          cx, cy, r: 2.4, fill: 'var(--muted)', opacity: 0.5
        }));
      }
      [3, 5, 7, 9, 15].forEach(i => addDot(cellCenter(i), (NECK_Y0 + NECK_Y1) / 2));
      [12].forEach(i => {
        const cx = cellCenter(i);
        addDot(cx, NECK_Y0 + 7);
        addDot(cx, NECK_Y1 - 7);
      });

      // Region overlays (clickable) + labels
      const regionsGroup = document.getElementById('regions');
      const regionEls = [];

      REGIONS.forEach((region, i) => {
        // Visual span: from the start of the lowest fret's cell (or the nut
        // for the open region) through the end of the highest fret's cell.
        const startX = region.lo === 0 ? NUT_X : fretX(region.lo - 1);
        const endX = fretX(region.hi);

        const g = createSVGElement('g', { class: 'region-segment' });
        g.appendChild(createSVGElement('rect', {
          class: 'region-fill', x: startX, y: NECK_Y0,
          width: endX - startX, height: NECK_Y1 - NECK_Y0
        }));

        const label = createSVGElement('text', { x: (startX + endX) / 2, y: NECK_Y1 + 14 });
        label.textContent = region.label;
        g.appendChild(label);

        g.addEventListener('click', () => selectRegion(i));
        regionsGroup.appendChild(g);
        regionEls.push(g);
      });

      function paintRegions() {
        regionEls.forEach((g, i) => {
          g.classList.toggle('selected', REGIONS[i] === selectedRegion);
        });
      }

      function selectRegion(i) {
        selectedRegion = REGIONS[i];
        paintRegions();
        document.getElementById('regionReadout').textContent = selectedRegion.label + ' fret';
        generate();
      }

      // Default: Open – 3rd locked in
      paintRegions();
    })();


    // ── Scale / chord data ─────────────────────────────────────────────────────────
    // MAJOR_QUALITIES/MINOR_QUALITIES, ROMAN_MAJOR/ROMAN_MINOR, getKeyRoot,
    // getScaleChords, STRING_SETS, TRIAD_INTERVALS, and spellChordTone come
    // from lib/triads.js.

    // ── Find triad voicings within a fret region ───────────────────────────────────

    // Unlike the original tightest-span search, this doesn't always return a
    // voicing — it returns one only if some octave placement of the chord
    // tone on each string lands entirely inside [regionLo, regionHi]. Open
    // strings are always allowed (a hand anchored in a higher region can
    // still let a string ring open), but at least one note must actually sit
    // inside the region itself — otherwise an all-open voicing would "belong"
    // to every region, which defeats the purpose of picking one.
    function findTriadVoicingInRegion(rootNote, quality, stringSet, inversion, regionLo, regionHi) {
      const ri = noteIndex(rootNote);
      const intervals = TRIAD_INTERVALS[quality];
      const roleNames = ['root', 'third', 'fifth'];
      const letterOffsets = [0, 2, 4];

      const set = STRING_SETS[stringSet];

      const notes = intervals.map(iv => (ri + iv) % 12);
      const noteNames = intervals.map((iv, idx) =>
        spellChordTone(rootNote, letterOffsets[idx], (ri + iv) % 12));

      // Reorder based on inversion: Root R-3-5, First 3-5-R, Second 5-R-3
      // (rotateForInversion comes from lib/triads.js).
      const orderedNotes = rotateForInversion(notes, inversion);
      const orderedRoles = rotateForInversion(roleNames, inversion);
      const orderedNoteNames = rotateForInversion(noteNames, inversion);

      // Raw fret for each string (0–11) before octave adjustment
      // (fretsFromOpenNotes comes from lib/triads.js).
      const frets = fretsFromOpenNotes(orderedNotes, set.openNotes);

      // Each string's note can be played at its raw fret or an octave higher
      // (0–11 or 12–23). Try every combination and keep whichever fits the
      // region with the tightest span, preferring the lowest position on ties.
      let bestFrets = null;
      let bestSpan = Infinity;
      let bestMin = Infinity;

      for (let mask = 0; mask < 8; mask++) {
        const adjusted = frets.map((f, i) => (mask & (1 << i)) ? f + 12 : f);

        // Every note must be genuinely fretted within the region — no open-
        // string exception. An open string always draws just above the nut,
        // which only makes visual sense in a diagram that actually shows a
        // nut (i.e. the Open region, where fret 0 already satisfies the
        // bounds check below on its own). Allowing opens to sneak into a
        // shifted, no-nut diagram elsewhere left them floating disconnected
        // from the real (fretted) notes, making the whole voicing look
        // mispositioned.
        const fits = adjusted.every(f => f >= regionLo && f <= regionHi);
        if (!fits) continue;

        const nonZero = adjusted.filter(f => f > 0);
        const span = nonZero.length ? Math.max(...nonZero) - Math.min(...nonZero) : 0;
        const minF = nonZero.length ? Math.min(...nonZero) : 0;

        if (span < bestSpan || (span === bestSpan && minF < bestMin)) {
          bestFrets = adjusted;
          bestSpan = span;
          bestMin = minF;
        }
      }

      if (!bestFrets) return null;

      return {
        frets: bestFrets,
        stringLabels: set.labels,
        noteRoles: orderedRoles,
        noteNames: orderedNoteNames,
        inversion: inversion,
        inversionName: inversion === 0 ? 'Root' : inversion === 1 ? '1st Inv' : '2nd Inv',
        stringSet: stringSet
      };
    }

    // drawTriadDiagram and formatChordName come from lib/triads.js.

    // ── Generate ───────────────────────────────────────────────────────────────────

    const STRING_SET_ORDER = ['EAD', 'ADG', 'DGB', 'GBe'];

    function generate() {
      const keyStr = KEYSTR_MAP[selectedKey];
      const mode = selectedKeyType;
      const region = selectedRegion;

      const root = getKeyRoot(keyStr, mode);
      const scaleChords = getScaleChords(keyStr, mode);
      const romans = mode === 'major' ? ROMAN_MAJOR : ROMAN_MINOR;
      const modeLabel = mode === 'major' ? 'Major' : 'Minor';

      document.getElementById('key-label').textContent = `${root} ${modeLabel} — Triads`;
      document.getElementById('region-label').textContent =
        `Frets ${region.lo}–${region.hi}`;

      const row = document.getElementById('chord-row');
      row.innerHTML = '';

      let anyFound = false;

      // For every diatonic triad, search every string set and inversion for
      // a voicing that fits inside the selected region. Chords with no
      // playable voicing there are left out entirely.
      scaleChords.forEach((chord, degree) => {
        const { note, quality } = chord;

        const found = [];
        STRING_SET_ORDER.forEach(stringSet => {
          [0, 1, 2].forEach(inv => {
            const voicing = findTriadVoicingInRegion(note, quality, stringSet, inv, region.lo, region.hi);
            if (voicing) found.push(voicing);
          });
        });

        if (found.length === 0) return;
        anyFound = true;

        // Sort by lowest fret used, then string set, then inversion — so the
        // most natural/lowest-position fingerings for this chord appear first.
        found.sort((a, b) => {
          const aMin = Math.min(...a.frets.filter(f => f > 0), Infinity);
          const bMin = Math.min(...b.frets.filter(f => f > 0), Infinity);
          if (aMin !== bMin) return aMin - bMin;
          const aSet = STRING_SET_ORDER.indexOf(a.stringSet);
          const bSet = STRING_SET_ORDER.indexOf(b.stringSet);
          if (aSet !== bSet) return aSet - bSet;
          return a.inversion - b.inversion;
        });

        const card = document.createElement('div');
        card.className = 'chord-card';
        card.style.animationDelay = `${degree * 0.06}s`;

        const displayName = formatChordName(note, quality);

        const voicingsHTML = found.map(voicing => `
          <div class="inversion-item">
            <div class="chord-inversion">${voicing.stringSet}<br><span class="voicing-strings">${voicing.inversionName}</span></div>
            ${drawTriadDiagram(voicing)}
          </div>
        `).join('');

        card.innerHTML = `
          <div class="chord-name">${displayName}</div>
          <div class="chord-numeral">${romans[degree]}</div>
          <div class="inversion-row">${voicingsHTML}</div>
        `;
        row.appendChild(card);
      });

      if (!anyFound) {
        row.innerHTML = `<div class="no-chord" style="width:auto;padding:24px 32px;">No triads from this key fall within the selected region.</div>`;
      }
    }

    // ── Init ───────────────────────────────────────────────────────────────────────

    renderCircle();
    generate();
  </script>
</body>

</html>
