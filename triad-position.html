<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triads by Position</title>
  <meta name="description" content="Find every diatonic triad in a key that falls within a chosen neighbourhood of the fretboard. Pick a key and a 4-fret region from the nut to the 15th fret, and see all triads and inversions playable there.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e1a'/%3E%3Cline x1='9' y1='6' x2='9' y2='26' stroke='%234a5d85' stroke-width='1.5'/%3E%3Cline x1='16' y1='6' x2='16' y2='26' stroke='%234a5d85' stroke-width='1.5'/%3E%3Cline x1='23' y1='6' x2='23' y2='26' stroke='%234a5d85' stroke-width='1.5'/%3E%3Cline x1='9' y1='8' x2='23' y2='8' stroke='%23223050' stroke-width='1.5'/%3E%3Cline x1='9' y1='16' x2='23' y2='16' stroke='%23223050' stroke-width='1.5'/%3E%3Cline x1='9' y1='24' x2='23' y2='24' stroke='%23223050' stroke-width='1.5'/%3E%3Ccircle cx='9' cy='12' r='2.6' fill='%23e0a940'/%3E%3Ccircle cx='16' cy='20' r='2.6' fill='%23e0a940'/%3E%3Ccircle cx='23' cy='8' r='2.6' fill='%23e0a940'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    html {
      zoom: 1.1;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(224, 169, 64, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(166, 122, 46, 0.06) 0%, transparent 50%);
    }

    /* footer's align-self:stretch (needed because this page's body is a
       centering flexbox) comes from theme.css. */

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 300px) minmax(280px, 1fr);
      grid-template-areas:
        "key   stave"
        "key   region";
      column-gap: 40px;
      row-gap: 32px;
      margin-bottom: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px 32px;
      border-radius: 4px;
      width: 100%;
      max-width: 900px;
    }

    @media (max-width: 700px) {
      .controls {
        grid-template-columns: 1fr;
        grid-template-areas:
          "key"
          "stave"
          "region";
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group.control-key { grid-area: key; }
    .control-group.control-stave { grid-area: stave; }
    .control-group.control-region { grid-area: region; }

    .control-group.control-key label {
      text-align: center;
    }

    /* A bare `label {}` rule used to live here, but .control-group label
       from theme.css (a more specific selector) always wins for every label
       on this page — they're all inside a .control-group — so it never had
       any effect. Removed rather than promoted. */

    /* #key-label, #chord-row, .chord-card (base — this page adds max-width
       below), @keyframes fadeUp, .chord-name, .chord-numeral, .inversion-row
       (base — this page adds flex-wrap below), .inversion-item, svg.chord-svg,
       and .no-chord come from theme.css (shared with chords.html).
       #region-label and .chord-inversion stay local since they're either
       page-specific (id) or differ slightly between the two pages. */

    #region-label {
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .chord-card {
      max-width: 420px;
    }

    .chord-inversion {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: #4a5d85;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.5;
    }

    .chord-inversion .voicing-strings {
      color: var(--amber);
    }

    .inversion-row {
      flex-wrap: wrap;
    }

    .legend {
      margin-top: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px 28px;
      border-radius: 4px;
      max-width: 500px;
      width: 100%;
    }

    .legend h3 {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* Fixed gold rather than var(--amber): these are fretboard note colors
       (must match drawTriadDiagram's roleColors in lib/triads.js exactly),
       not the site's UI accent — left unchanged by the theme. */
    .legend-dot.root { background: #c9a84c; }
    .legend-dot.third { background: #6a9fb5; }
    .legend-dot.fifth { background: #8b5e3c; }
    .legend-dot.tone { background: #6e677e; }

    /* ── Circle of fifths (key selector) ─────────────────────────────────────── */

    .circle-container {
      display: flex;
      justify-content: center;
    }

    #circle-of-fifths {
      width: 100%;
      max-width: 280px;
      height: auto;
    }

    /* .circle-segment's base + major/minor hover/selected states, and
       .circle-text, come from theme.css. */

    /* ── Fret region picker ──────────────────────────────────────────────────── */

    .region-picker {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .region-picker .neck-wrap {
      position: relative;
      max-width: 340px; /* matches #key-stave's max-width (theme.css) */
      width: 100%;
    }

    .region-picker svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .region-segment {
      cursor: pointer;
    }

    .region-segment rect.region-fill {
      fill: transparent;
      stroke: transparent;
      transition: fill 0.15s ease, stroke 0.15s ease;
    }

    /* A translucent gold wash alone reads as muddy brown once it's blended
       with the dark navy neck behind it — a crisp gold border keeps the
       highlight unambiguously gold at a glance. */
    .region-segment:hover rect.region-fill {
      fill: rgba(224, 169, 64, 0.22);
      stroke: #e0a940;
      stroke-width: 1.5;
    }

    .region-segment.selected rect.region-fill {
      fill: rgba(224, 169, 64, 0.38);
      stroke: #e0a940;
      stroke-width: 1.25;
    }

    .region-segment text {
      fill: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      text-anchor: middle;
      pointer-events: none;
      transition: fill 0.15s ease;
    }

    .region-segment.selected text {
      fill: var(--amber);
    }

    .region-picker .readout {
      margin-top: 8px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      min-height: 20px;
    }

    .region-picker .readout .value {
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: var(--amber);
    }
  </style>
</head>

<body>
  <a href="index.html" class="back-link">&larr; Toolkit Home</a>

  <header>
    <h1>Triads by Position</h1>
    <p>Triads for each scale degree by position</p>
  </header>

  <div class="controls">
    <div class="control-group control-key">
      <label>Key</label>
      <div class="circle-container">
        <svg id="circle-of-fifths" width="400" height="400" viewBox="0 0 400 400"></svg>
      </div>
    </div>
    <div class="control-group control-stave">
      <label>Staff</label>
      <div class="stave-container">
        <svg id="key-stave" viewBox="10 0 550 173.33"></svg>
        <div class="stave-label" id="stave-label"></div>
      </div>
    </div>
    <div class="control-group control-region">
      <label>Fretboard Region</label>
      <div class="region-picker">
        <div class="neck-wrap">
          <svg id="neck" viewBox="13 0 287 90" xmlns="http://www.w3.org/2000/svg">

            <!-- ===== neck base ===== -->
            <rect x="20" y="23" width="260" height="34" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

            <!-- ===== fret ticks ===== -->
            <g id="fretTicks"></g>

            <!-- ===== position markers ===== -->
            <g id="positionMarkers"></g>

            <!-- ===== nut ===== -->
            <rect x="15" y="18" width="5" height="44" fill="var(--cream)"/>

            <!-- ===== region overlays (clickable) ===== -->
            <g id="regions"></g>

          </svg>
        </div>
        <div class="readout">
          <span class="value" id="regionReadout">Open – 3rd fret</span>
        </div>
      </div>
    </div>
  </div>

  <div id="key-label"></div>
  <div id="region-label"></div>
  <div id="chord-row"></div>

  <div class="legend">
    <h3>Legend</h3>
    <div class="legend-item">
      <div class="legend-dot root"></div>
      <span>Root (R)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot third"></div>
      <span>Third (3)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot fifth"></div>
      <span>Fifth (5)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot tone"></div>
      <span>Scale tone (staff)</span>
    </div>
  </div>

  <footer>Designed by Jon Thornton. Implemented by Claude.</footer>

  <script src="lib/svg-utils.js"></script>
  <script src="lib/theory.js"></script>
  <script src="lib/triads.js"></script>
  <script src="lib/circle-of-fifths.js"></script>
  <script src="lib/stave.js"></script>
  <script src="lib/region-picker.js"></script>
  <script>
    // ── Note helpers ──────────────────────────────────────────────────────────────
    // NOTES, LETTERS, LETTER_SEMITONE, and noteIndex come from theory.js.
    // spellScale and chooseBestRoot come from lib/triads.js.

    // ── Circle of Fifths (Key selector) ──────────────────────────────────────────
    // KEYSTR_MAP comes from lib/triads.js.
    // MAJOR_KEYS, MINOR_KEYS, and renderCircleOfFifths come from
    // circle-of-fifths.js. getPosition, createArcPath, and createSVGElement
    // come from svg-utils.js.

    let selectedKey = 'C';
    let selectedKeyType = 'major';

    function renderCircle() {
      renderCircleOfFifths({
        selectedKey,
        selectedKeyType,
        onSelect: (name, type) => selectKey(name, type),
        onHover: (name, type) => renderStave(name, type),
        onHoverEnd: () => renderStave(selectedKey, selectedKeyType),
      });
    }

    function selectKey(keyName, keyType) {
      selectedKey = keyName;
      selectedKeyType = keyType;
      renderCircle();
      renderStave(keyName, keyType);
      generate();
    }

    // ── Staff ──────────────────────────────────────────────────────────────────
    // ROOT_SPELLING_MAJOR/MINOR, buildDiatonicScale, formatSpelledNote,
    // absoluteStaffStep, LETTER_INDEX, MAJOR_SCALE_INTERVALS,
    // MINOR_SCALE_INTERVALS, and getKeySignature come from theory.js.
    // renderMusicStave comes from lib/stave.js, which calls back into this
    // page's own degreeColor(index, degreeNames) to color each notehead —
    // root/third/fifth match drawTriadDiagram's roleColors in lib/triads.js
    // exactly (same colors as this page's own legend); every other diatonic
    // degree (2, 4, 6, 7, etc.) gets the shared neutral "scale tone" gray,
    // since this page only ever highlights chord tones elsewhere.
    const DEGREE_COLORS = { 'Root': '#c9a84c', '3': '#6a9fb5', 'b3': '#6a9fb5', '5': '#8b5e3c' };
    const DEFAULT_TONE_COLOR = '#6e677e';
    const SEMITONE_DEGREE_NAMES =
      ['Root', 'b2', '2', 'b3', '3', '4', 'b5', '5', 'b6', '6', 'b7', '7'];

    function degreeColor(index, degreeNames) {
      return DEGREE_COLORS[degreeNames[index]] || DEFAULT_TONE_COLOR;
    }

    // Octave-assigned notes for the selected key's own plain diatonic scale
    // (major/Ionian or natural minor/Aeolian) — same octave-tracking
    // algorithm modes.html/scales.html use for their own staves: start the
    // tonic at octave 4 and bump the octave whenever the diatonic letter
    // sequence wraps around (e.g. B -> C).
    function keyStaffNotes(keyName, keyType) {
      const table = keyType === 'minor' ? ROOT_SPELLING_MINOR : ROOT_SPELLING_MAJOR;
      const [letter, accidental] = table[keyName];
      const formula = keyType === 'minor' ? MINOR_SCALE_INTERVALS : MAJOR_SCALE_INTERVALS;
      const diatonic = buildDiatonicScale(letter, accidental, formula);

      let octave = 4;
      let prevLetterIdx = null;
      return diatonic.map(entry => {
        const letterIdx = LETTER_INDEX[entry.letter];
        if (prevLetterIdx !== null && letterIdx < prevLetterIdx) octave++;
        prevLetterIdx = letterIdx;
        return {
          letter: entry.letter,
          accidental: entry.accidental,
          octave,
          name: formatSpelledNote(entry),
          step: absoluteStaffStep(entry.letter, octave),
        };
      });
    }

    function renderStave(keyName, keyType) {
      const sig = getKeySignature(keyName, keyType);
      const notes = keyStaffNotes(keyName, keyType);
      const scaleIntervals = keyType === 'minor' ? MINOR_SCALE_INTERVALS : MAJOR_SCALE_INTERVALS;
      const degreeNames = scaleIntervals.map(iv => SEMITONE_DEGREE_NAMES[iv]);

      renderMusicStave({
        sig,
        notes,
        degreeNames,
        getLabelLines: () => {
          const symbol = sig.type === 'sharp' ? '♯' : '♭';
          const count = sig.letters.length;
          const sigLine = count === 0 ? 'No sharps or flats'
            : `${count} ${sig.type}${count > 1 ? 's' : ''}: ${sig.letters.map(l => l + symbol).join(' ')}`;
          const modeLabel = keyType === 'major' ? 'Major' : 'Minor';
          return [`${sig.tonicName} ${modeLabel}`, sigLine];
        },
      });
    }

    // ── Fret region picker ───────────────────────────────────────────────────────
    // REGIONS, buildRegionPicker, and paintRegionPicker come from
    // lib/region-picker.js.

    let selectedRegion = REGIONS[0];

    buildRegionPicker({
      onSelect: (region) => {
        selectedRegion = region;
        paintRegionPicker(selectedRegion);
        generate();
      }
    });
    paintRegionPicker(selectedRegion);


    // ── Scale / chord data ─────────────────────────────────────────────────────────
    // MAJOR_QUALITIES/MINOR_QUALITIES, ROMAN_MAJOR/ROMAN_MINOR, getKeyRoot,
    // getScaleChords, STRING_SETS, TRIAD_INTERVALS, and spellChordTone come
    // from lib/triads.js.

    // ── Find triad voicings within a fret region ───────────────────────────────────

    // Unlike the original tightest-span search, this doesn't always return a
    // voicing — it returns one only if some octave placement of the chord
    // tone on each string lands inside [regionLo, regionHi], or within
    // MAX_FRET_OVERFLOW frets of it. That tolerance matters because the
    // regions are an arbitrary chop of the neck into fixed 4-fret windows,
    // and plenty of real voicings straddle a window boundary — e.g. the
    // 1st-inversion G triad on G-B-e sits at frets 4-3-3, split right across
    // the Open-3rd/4th-7th line, so no window ever contains it exactly.
    // Every note must be genuinely fretted within (or just outside) the
    // region — no open-string exception. An open string always draws just
    // above the nut, which only makes visual sense in a diagram that
    // actually shows a nut (i.e. the Open region, where fret 0 already
    // satisfies the bounds check below on its own). Allowing opens to sneak
    // into a shifted, no-nut diagram elsewhere left them floating
    // disconnected from the real (fretted) notes, making the whole voicing
    // look mispositioned.
    const MAX_FRET_OVERFLOW = 1;

    function findTriadVoicingInRegion(rootNote, quality, stringSet, inversion, regionLo, regionHi) {
      const ri = noteIndex(rootNote);
      const intervals = TRIAD_INTERVALS[quality];
      const roleNames = ['root', 'third', 'fifth'];
      const letterOffsets = [0, 2, 4];

      const set = STRING_SETS[stringSet];

      const notes = intervals.map(iv => (ri + iv) % 12);
      const noteNames = intervals.map((iv, idx) =>
        spellChordTone(rootNote, letterOffsets[idx], (ri + iv) % 12));

      // Reorder based on inversion: Root R-3-5, First 3-5-R, Second 5-R-3
      // (rotateForInversion comes from lib/triads.js).
      const orderedNotes = rotateForInversion(notes, inversion);
      const orderedRoles = rotateForInversion(roleNames, inversion);
      const orderedNoteNames = rotateForInversion(noteNames, inversion);

      // Raw fret for each string (0–11) before octave adjustment
      // (fretsFromOpenNotes comes from lib/triads.js).
      const frets = fretsFromOpenNotes(orderedNotes, set.openNotes);

      // Each string's note can be played at its raw fret or an octave higher
      // (0–11 or 12–23). Try every combination and keep whichever sits
      // closest to the region — zero overflow (fully inside) wins whenever
      // that's achievable, exactly like the old hard containment check;
      // ties break on tightest span, then lowest position.
      let bestFrets = null;
      let bestOverflow = Infinity;
      let bestSpan = Infinity;
      let bestMin = Infinity;

      for (let mask = 0; mask < 8; mask++) {
        const adjusted = frets.map((f, i) => (mask & (1 << i)) ? f + 12 : f);

        const overflow = Math.max(...adjusted.map(f =>
          Math.max(0, regionLo - f) + Math.max(0, f - regionHi)));

        const nonZero = adjusted.filter(f => f > 0);
        const span = nonZero.length ? Math.max(...nonZero) - Math.min(...nonZero) : 0;
        const minF = nonZero.length ? Math.min(...nonZero) : 0;

        if (overflow < bestOverflow ||
            (overflow === bestOverflow && span < bestSpan) ||
            (overflow === bestOverflow && span === bestSpan && minF < bestMin)) {
          bestFrets = adjusted;
          bestOverflow = overflow;
          bestSpan = span;
          bestMin = minF;
        }
      }

      if (!bestFrets || bestOverflow > MAX_FRET_OVERFLOW) return null;

      return {
        frets: bestFrets,
        stringLabels: set.labels,
        noteRoles: orderedRoles,
        noteNames: orderedNoteNames,
        inversion: inversion,
        inversionName: inversion === 0 ? 'Root' : inversion === 1 ? '1st Inv' : '2nd Inv',
        stringSet: stringSet
      };
    }

    // drawTriadDiagram and formatChordName come from lib/triads.js.

    // ── Generate ───────────────────────────────────────────────────────────────────

    const STRING_SET_ORDER = ['EAD', 'ADG', 'DGB', 'GBe'];

    function generate() {
      const keyStr = KEYSTR_MAP[selectedKey];
      const mode = selectedKeyType;
      const region = selectedRegion;

      const root = getKeyRoot(keyStr, mode);
      const scaleChords = getScaleChords(keyStr, mode);
      const romans = mode === 'major' ? ROMAN_MAJOR : ROMAN_MINOR;
      const modeLabel = mode === 'major' ? 'Major' : 'Minor';

      document.getElementById('key-label').textContent = `${root} ${modeLabel} — Triads`;
      document.getElementById('region-label').textContent =
        `Frets ${region.lo}–${region.hi}`;

      const row = document.getElementById('chord-row');
      row.innerHTML = '';

      let anyFound = false;

      // For every diatonic triad, search every string set and inversion for
      // a voicing that fits inside the selected region. Chords with no
      // playable voicing there are left out entirely.
      scaleChords.forEach((chord, degree) => {
        const { note, quality } = chord;

        const found = [];
        STRING_SET_ORDER.forEach(stringSet => {
          [0, 1, 2].forEach(inv => {
            const voicing = findTriadVoicingInRegion(note, quality, stringSet, inv, region.lo, region.hi);
            if (voicing) found.push(voicing);
          });
        });

        if (found.length === 0) return;
        anyFound = true;

        // Sort by lowest fret used, then string set, then inversion — so the
        // most natural/lowest-position fingerings for this chord appear first.
        found.sort((a, b) => {
          const aMin = Math.min(...a.frets.filter(f => f > 0), Infinity);
          const bMin = Math.min(...b.frets.filter(f => f > 0), Infinity);
          if (aMin !== bMin) return aMin - bMin;
          const aSet = STRING_SET_ORDER.indexOf(a.stringSet);
          const bSet = STRING_SET_ORDER.indexOf(b.stringSet);
          if (aSet !== bSet) return aSet - bSet;
          return a.inversion - b.inversion;
        });

        const card = document.createElement('div');
        card.className = 'chord-card';
        card.style.animationDelay = `${degree * 0.06}s`;

        const displayName = formatChordName(note, quality);

        const voicingsHTML = found.map(voicing => `
          <div class="inversion-item">
            <div class="chord-inversion">${voicing.stringSet}<br><span class="voicing-strings">${voicing.inversionName}</span></div>
            ${drawTriadDiagram(voicing)}
          </div>
        `).join('');

        card.innerHTML = `
          <div class="chord-name">${displayName}</div>
          <div class="chord-numeral">${romans[degree]}</div>
          <div class="inversion-row">${voicingsHTML}</div>
        `;
        row.appendChild(card);
      });

      if (!anyFound) {
        row.innerHTML = `<div class="no-chord" style="width:auto;padding:24px 32px;">No triads from this key fall within the selected region.</div>`;
      }
    }

    // ── Init ───────────────────────────────────────────────────────────────────────

    renderCircle();
    renderStave(selectedKey, selectedKeyType);
    generate();
  </script>
</body>

</html>
