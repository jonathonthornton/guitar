<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Explorer — Chords by String Set or Fretboard Region</title>
  <meta name="description"
    content="Interactive guitar chord voicing finder. Pick a key on the circle of fifths and a chord type, then restrict the search by string set or by fretboard region.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e1a'/%3E%3Cline x1='9' y1='6' x2='9' y2='26' stroke='%234a5d85' stroke-width='1.5'/%3E%3Cline x1='16' y1='6' x2='16' y2='26' stroke='%234a5d85' stroke-width='1.5'/%3E%3Cline x1='23' y1='6' x2='23' y2='26' stroke='%234a5d85' stroke-width='1.5'/%3E%3Cline x1='9' y1='8' x2='23' y2='8' stroke='%23223050' stroke-width='1.5'/%3E%3Cline x1='9' y1='16' x2='23' y2='16' stroke='%23223050' stroke-width='1.5'/%3E%3Cline x1='9' y1='24' x2='23' y2='24' stroke='%23223050' stroke-width='1.5'/%3E%3Ccircle cx='9' cy='12' r='2.6' fill='%23e0a940'/%3E%3Ccircle cx='16' cy='20' r='2.6' fill='%23e0a940'/%3E%3Ccircle cx='23' cy='8' r='2.6' fill='%23e0a940'/%3E%3C/svg%3E">
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    html {
      zoom: 1.1;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(224, 169, 64, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(166, 122, 46, 0.06) 0%, transparent 50%);
    }

    .controls {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px 32px;
      border-radius: 4px;
      width: 100%;
      max-width: 1100px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 140px;
    }

    .control-group.control-key {
      flex: 0 1 280px;
    }

    .control-group.control-mode {
      flex: 0 1 160px;
    }

    .control-group.control-restrict {
      flex: 0 1 300px;
    }

    .control-group.control-key label,
    .control-group.control-mode label,
    .control-group.control-restrict label {
      text-align: center;
    }

    .type-radios {
      display: flex;
      flex-direction: column;
    }

    .type-radios label {
      position: relative;
      display: flex;
      align-items: center;
      padding: 7px 10px;
      border-left: 3px solid transparent;
      border-radius: 0 3px 3px 0;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: normal;
      text-transform: none;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .type-radios label:hover {
      color: var(--cream);
      background: rgba(255, 255, 255, 0.03);
    }

    .type-radios input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .type-radios label:has(input:checked) {
      color: var(--amber);
      border-left-color: var(--amber);
      background: rgba(224, 169, 64, 0.12);
      font-weight: 500;
    }

    .type-radios label:has(input:focus-visible) {
      outline: 2px solid var(--amber);
      outline-offset: -2px;
    }

    #mode-label {
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 40px;
    }

    /* Info affordance next to #key-label, shown only for chord types with no
       major/minor form of their own (dim/aug/sus2/sus4) — the tooltip
       explains that their roots still follow the selected mode's scale
       degrees even though the title omits "Major"/"Minor". */
    .key-info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid var(--muted);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-style: italic;
      vertical-align: middle;
      cursor: help;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .key-info-icon:hover,
    .key-info-icon:focus-visible {
      color: var(--amber);
      border-color: var(--amber);
      outline: none;
    }

    .chord-inversion {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: #4a5d85;
      text-transform: uppercase;
    }

    /* Wide enough that four inversion-item diagrams (region mode) sit on one
       row instead of wrapping; still comfortably fits the three diagrams
       shown in string-set mode. */
    .chord-card {
      max-width: 500px;
    }

    .inversion-row {
      flex-wrap: wrap;
    }

    .legend {
      margin-top: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px 28px;
      border-radius: 4px;
      max-width: 500px;
      width: 100%;
    }

    .legend h3 {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* Fixed gold rather than var(--amber): these are fretboard note colors
       (must match drawTriadDiagram's roleColors in lib/triads.js exactly),
       not the site's UI accent — left unchanged by the theme. */
    .legend-dot.root {
      background: #c9a84c;
    }

    .legend-dot.third {
      background: #6a9fb5;
    }

    .legend-dot.fifth {
      background: #8b5e3c;
    }

    .legend-dot.seventh {
      background: #7b68a6;
    }

    .legend-dot.sus {
      background: #6ab57a;
    }

    /* ── Circle of fifths (key + mode selector) ──────────────────────────────── */

    .circle-container {
      display: flex;
      justify-content: center;
    }

    /* #circle-of-fifths, .circle-segment (base + major/minor hover/selected),
       and .circle-text are injected by lib/circle-of-fifths.js. */

    /* .string-picker and everything inside it are injected by
       lib/string-picker.js. .region-picker and everything inside it are
       injected by lib/region-picker.js. */
  </style>

<body>
  <a href="index.html" class="back-link">&larr; Toolkit Home</a>

  <header>
    <h1>Chords</h1>
    <p>Chords by string set or fretboard region</p>
  </header>

  <div class="controls">
    <div class="control-group control-key">
      <label>Key</label>
      <div class="circle-container" id="circle-of-fifths-mount"></div>
    </div>

    <div class="control-group control-mode">
      <label>Restrict By</label>
      <div class="type-radios" id="mode-radios">
        <label><input type="radio" name="restrict-mode" value="stringset" checked> String Set</label>
        <label><input type="radio" name="restrict-mode" value="region"> Fretboard Region</label>
      </div>
    </div>

    <div class="control-group control-restrict">
      <label id="restrict-widget-label">String Set</label>

      <div class="string-picker" id="stringset-control"></div>

      <div class="region-picker" id="region-control" style="display:none"></div>
    </div>

    <div class="control-group">
      <label>Chord Type</label>
      <div class="type-radios" id="type-radios">
        <label><input type="radio" name="chord-type" value="triad" checked> Triads</label>
        <label><input type="radio" name="chord-type" value="dom7"> Dominant 7th</label>
        <label><input type="radio" name="chord-type" value="maj7"> Major 7th</label>
        <label><input type="radio" name="chord-type" value="sus2"> Sus 2</label>
        <label><input type="radio" name="chord-type" value="sus4"> Sus 4</label>
        <label><input type="radio" name="chord-type" value="aug"> Augmented</label>
        <label><input type="radio" name="chord-type" value="dim"> Diminished</label>
      </div>
    </div>
  </div>

  <div id="key-label"></div>
  <div id="mode-label"></div>
  <div id="chord-row"></div>

  <div class="legend">
    <h3>Legend</h3>
    <div class="legend-item">
      <div class="legend-dot root"></div>
      <span>Root (R)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot third"></div>
      <span>Third (3)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot fifth"></div>
      <span>Fifth (5)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot seventh"></div>
      <span>Seventh (7)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot sus"></div>
      <span>Suspended (2nd / 4th)</span>
    </div>
  </div>

  <footer>Designed by Jon Thornton. Implemented by Claude.</footer>

  <script src="lib/svg-utils.js"></script>
  <script src="lib/theory.js"></script>
  <script src="lib/triads.js"></script>
  <script src="lib/circle-of-fifths.js"></script>
  <script src="lib/region-picker.js"></script>
  <script src="lib/string-picker.js"></script>
  <script>
    // ── Note helpers ──────────────────────────────────────────────────────────────
    // NOTES, LETTERS, LETTER_SEMITONE, and noteIndex() come from theory.js.
    // spellScale and chooseBestRoot come from lib/triads.js.

    // ── Circle of Fifths (Key + Mode selector) ───────────────────────────────────
    // KEYSTR_MAP comes from lib/triads.js.
    // MAJOR_KEYS, MINOR_KEYS, and renderCircleOfFifths come from circle-of-fifths.js.
    // getPosition, createArcPath, and createSVGElement come from svg-utils.js.

    let selectedKey = 'C';
    let selectedKeyType = 'major';

    function renderCircle() {
      renderCircleOfFifths({
        maxWidth: 280,
        selectedKey,
        selectedKeyType,
        onSelect: (name, type) => selectKey(name, type),
      });
    }

    function selectKey(keyName, keyType) {
      selectedKey = keyName;
      selectedKeyType = keyType;
      renderCircle();
      generate();
    }

    // ── Restrict-by mode toggle ───────────────────────────────────────────────────

    let restrictMode = 'stringset';

    document.querySelectorAll('input[name="restrict-mode"]').forEach(input => {
      input.addEventListener('change', (e) => {
        restrictMode = e.target.value;
        document.getElementById('stringset-control').style.display = restrictMode === 'stringset' ? '' : 'none';
        document.getElementById('region-control').style.display = restrictMode === 'region' ? '' : 'none';
        document.getElementById('restrict-widget-label').textContent =
          restrictMode === 'stringset' ? 'String Set' : 'Fretboard Region';
        generate();
      });
    });

    // ── String set picker (fretboard) ────────────────────────────────────────────
    // buildStringSetPicker comes from lib/string-picker.js.

    let selectedStringSet = 'GBe';

    buildStringSetPicker({
      onSelect: (key) => {
        selectedStringSet = key;
        generate();
      }
    });

    // ── Fret region picker ───────────────────────────────────────────────────────
    // REGIONS, buildRegionPicker, and paintRegionPicker come from
    // lib/region-picker.js.

    let selectedRegion = REGIONS[0];

    buildRegionPicker({
      align: 'center',
      neckMaxWidth: 300,
      onSelect: (region) => {
        selectedRegion = region;
        paintRegionPicker(selectedRegion);
        generate();
      }
    });
    paintRegionPicker(selectedRegion);

    // ── Scale / chord data ─────────────────────────────────────────────────────────
    // MAJOR_QUALITIES/MINOR_QUALITIES, ROMAN_MAJOR/ROMAN_MINOR, getKeyRoot,
    // getScaleChords, STRING_SETS, and TRIAD_INTERVALS come from lib/triads.js.

    // Shell voicings for 7th chords (R-3-7, omitting 5th)
    const MAJ7_INTERVALS = {
      maj: [0, 4, 11],  // root, major 3rd, major 7th (maj7)
      min: [0, 3, 10],  // root, minor 3rd, minor 7th (min7)
      dim: [0, 3, 9]    // root, minor 3rd, dim 7th (dim7 / half-dim uses m7)
    };

    const DOM7_INTERVALS = {
      maj: [0, 4, 10],  // root, major 3rd, minor 7th (dom7)
      min: [0, 3, 10],  // root, minor 3rd, minor 7th (min7)
      dim: [0, 3, 9]    // root, minor 3rd, diminished 7th (dim7)
    };

    // Sus chords replace the 3rd with a 2nd or 4th (quality is irrelevant)
    const SUS2_INTERVALS = { maj: [0, 2, 7], min: [0, 2, 7], dim: [0, 2, 7] };
    const SUS4_INTERVALS = { maj: [0, 5, 7], min: [0, 5, 7], dim: [0, 5, 7] };

    // spellChordTone comes from lib/triads.js.

    // Chosen once here so both voicing search strategies below (unconstrained
    // string-set search and region-constrained search) dispatch on chord type
    // identically instead of duplicating this table.
    function getChordIntervals(chordType, quality) {
      if (chordType === 'maj7') {
        return { intervals: MAJ7_INTERVALS[quality], roleNames: ['root', 'third', 'seventh'], letterOffsets: [0, 2, 6] };
      } else if (chordType === 'dom7') {
        return { intervals: DOM7_INTERVALS[quality], roleNames: ['root', 'third', 'seventh'], letterOffsets: [0, 2, 6] };
      } else if (chordType === 'sus2') {
        return { intervals: SUS2_INTERVALS[quality], roleNames: ['root', 'sus', 'fifth'], letterOffsets: [0, 1, 4] };
      } else if (chordType === 'sus4') {
        return { intervals: SUS4_INTERVALS[quality], roleNames: ['root', 'sus', 'fifth'], letterOffsets: [0, 3, 4] };
      } else if (chordType === 'dim') {
        return { intervals: [0, 3, 6], roleNames: ['root', 'third', 'fifth'], letterOffsets: [0, 2, 4] };   // root, minor 3rd, diminished 5th
      } else if (chordType === 'aug') {
        return { intervals: [0, 4, 8], roleNames: ['root', 'third', 'fifth'], letterOffsets: [0, 2, 4] };   // root, major 3rd, augmented 5th
      } else {
        return { intervals: TRIAD_INTERVALS[quality], roleNames: ['root', 'third', 'fifth'], letterOffsets: [0, 2, 4] };
      }
    }

    // ── Calculate triad voicing (unconstrained — single fixed string set) ───────────
    // Same tightest-span search chords.html uses: every note can be played at
    // its raw fret or an octave higher, and whichever combination gives the
    // smallest span wins (lowest position on ties).

    function calculateTriadVoicing(rootNote, quality, stringSet, inversion, chordType) {
      const ri = noteIndex(rootNote);
      const { intervals, roleNames, letterOffsets } = getChordIntervals(chordType, quality);
      const set = STRING_SETS[stringSet];

      const notes = intervals.map(iv => (ri + iv) % 12);
      const noteNames = intervals.map((iv, idx) =>
        spellChordTone(rootNote, letterOffsets[idx], (ri + iv) % 12));

      // Reorder based on inversion: Root R-3-5/7, First 3-5/7-R, Second 5/7-R-3
      // (rotateForInversion comes from lib/triads.js).
      const orderedNotes = rotateForInversion(notes, inversion);
      const orderedRoles = rotateForInversion(roleNames, inversion);
      const orderedNoteNames = rotateForInversion(noteNames, inversion);

      // Calculate fret for each string to produce the required note
      // (fretsFromOpenNotes comes from lib/triads.js).
      const frets = fretsFromOpenNotes(orderedNotes, set.openNotes);

      let bestFrets = null;
      let bestSpan = Infinity;
      let bestMin = Infinity;

      for (let mask = 0; mask < 8; mask++) {
        const adjusted = frets.map((f, i) => (mask & (1 << i)) ? f + 12 : f);
        const adjMin = Math.min(...adjusted);
        const adjMax = Math.max(...adjusted);
        const span = adjMax - adjMin;

        if (adjMin < 0 || adjMin > 12) continue; // keep the voicing in a playable position

        if (span < bestSpan || (span === bestSpan && adjMin < bestMin)) {
          bestFrets = adjusted;
          bestSpan = span;
          bestMin = adjMin;
        }
      }

      return {
        frets: bestFrets,
        stringLabels: set.labels,
        noteRoles: orderedRoles,
        noteNames: orderedNoteNames,
        inversion: inversion,
        inversionName: inversion === 0 ? 'Root' : inversion === 1 ? '1st Inv' : '2nd Inv'
      };
    }

    // ── Find chord voicing within a fret region (any string set) ────────────────────
    // Same overflow-tolerant search triad-position.html uses, generalized to
    // any chord type via getChordIntervals rather than always plain triads.
    // A voicing is accepted only if some octave placement of every chord tone
    // lands inside [regionLo, regionHi], or within MAX_FRET_OVERFLOW frets of
    // it — real voicings often straddle a region boundary since the regions
    // are an arbitrary chop of the neck into fixed 4-fret windows.

    const MAX_FRET_OVERFLOW = 1;

    function findChordVoicingInRegion(rootNote, quality, stringSet, inversion, chordType, regionLo, regionHi) {
      const ri = noteIndex(rootNote);
      const { intervals, roleNames, letterOffsets } = getChordIntervals(chordType, quality);
      const set = STRING_SETS[stringSet];

      const notes = intervals.map(iv => (ri + iv) % 12);
      const noteNames = intervals.map((iv, idx) =>
        spellChordTone(rootNote, letterOffsets[idx], (ri + iv) % 12));

      const orderedNotes = rotateForInversion(notes, inversion);
      const orderedRoles = rotateForInversion(roleNames, inversion);
      const orderedNoteNames = rotateForInversion(noteNames, inversion);

      const frets = fretsFromOpenNotes(orderedNotes, set.openNotes);

      let bestFrets = null;
      let bestOverflow = Infinity;
      let bestSpan = Infinity;
      let bestMin = Infinity;

      for (let mask = 0; mask < 8; mask++) {
        const adjusted = frets.map((f, i) => (mask & (1 << i)) ? f + 12 : f);

        const overflow = Math.max(...adjusted.map(f =>
          Math.max(0, regionLo - f) + Math.max(0, f - regionHi)));

        const nonZero = adjusted.filter(f => f > 0);
        const span = nonZero.length ? Math.max(...nonZero) - Math.min(...nonZero) : 0;
        const minF = nonZero.length ? Math.min(...nonZero) : 0;

        if (overflow < bestOverflow ||
          (overflow === bestOverflow && span < bestSpan) ||
          (overflow === bestOverflow && span === bestSpan && minF < bestMin)) {
          bestFrets = adjusted;
          bestOverflow = overflow;
          bestSpan = span;
          bestMin = minF;
        }
      }

      if (!bestFrets || bestOverflow > MAX_FRET_OVERFLOW) return null;

      return {
        frets: bestFrets,
        stringLabels: set.labels,
        noteRoles: orderedRoles,
        noteNames: orderedNoteNames,
        inversion: inversion,
        inversionName: inversion === 0 ? 'Root' : inversion === 1 ? '1st Inv' : '2nd Inv'
      };
    }

    // drawTriadDiagram and formatChordName come from lib/triads.js.

    // ── Generate ───────────────────────────────────────────────────────────────────

    function isDiatonicSusChord(chordRootPc, chordType, scalePcSet) {
      const intervals = chordType === 'sus2' ? [0, 2, 7] : [0, 5, 7];
      return intervals.every(iv => scalePcSet.has((chordRootPc + iv) % 12));
    }

    const ROMAN_NEUTRAL = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
    const STRING_SET_ORDER = ['EAD', 'ADG', 'DGB', 'GBe'];

    function generate() {
      const chordType = document.querySelector('input[name="chord-type"]:checked').value;

      const keyStr = KEYSTR_MAP[selectedKey];
      const mode = selectedKeyType;

      const root = getKeyRoot(keyStr, mode);
      const scaleChords = getScaleChords(keyStr, mode);
      // Diminished, augmented, sus2, and sus4 chords don't have distinct
      // major/minor forms — the same interval shape is used regardless of a
      // scale degree's natural quality — so upper/lowercase numeral case
      // would be misleading and the Major/Minor label is omitted from the
      // title.
      const isModeInvariantType = chordType === 'dim' || chordType === 'aug' ||
        chordType === 'sus2' || chordType === 'sus4';
      const romans = isModeInvariantType ? ROMAN_NEUTRAL :
        mode === 'major' ? ROMAN_MAJOR : ROMAN_MINOR;

      const typeLabel = chordType === 'maj7' ? 'Major 7th Chords' :
        chordType === 'dom7' ? 'Dominant 7th Chords' :
          chordType === 'sus2' ? 'Sus 2 Chords' :
            chordType === 'sus4' ? 'Sus 4 Chords' :
              chordType === 'dim' ? 'Diminished Triads' :
                chordType === 'aug' ? 'Augmented Triads' : 'Triads';

      const modeLabel = isModeInvariantType ? '' :
        mode === 'major' ? 'Major' : mode === 'minor' ? 'Minor' : '';
      const titleText = modeLabel ? `${root} ${modeLabel} — ${typeLabel}` : `${root} — ${typeLabel}`;
      // These chord types have no major/minor form of their own, but their
      // roots are still drawn from the selected key's scale degrees — call
      // that out with an optional-read info icon rather than baking it into
      // the title text itself.
      const infoIconHTML = isModeInvariantType
        ? ` <span class="key-info-icon" tabindex="0" title="These chords don&#8217;t have major or minor forms, but their roots still follow the scale degrees of the selected key.">i</span>`
        : '';
      document.getElementById('key-label').innerHTML = titleText + infoIconHTML;

      const row = document.getElementById('chord-row');
      row.innerHTML = '';

      const scaleIntervals = mode === 'major' ? MAJOR_SCALE_INTERVALS : MINOR_SCALE_INTERVALS;
      const rootPc = noteIndex(root);
      const scalePcSet = new Set(scaleIntervals.map(iv => (rootPc + iv) % 12));
      const isSus = chordType === 'sus2' || chordType === 'sus4';

      if (restrictMode === 'stringset') {
        const stringSet = selectedStringSet;
        document.getElementById('mode-label').textContent = `${stringSet} strings`;

        scaleChords.forEach((chord, degree) => {
          const { note, quality } = chord;

          // Skip non-diatonic sus chords entirely
          if (isSus && !isDiatonicSusChord(noteIndex(note), chordType, scalePcSet)) return;

          const card = document.createElement('div');
          card.className = 'chord-card';
          card.style.animationDelay = `${degree * 0.06}s`;

          const displayName = formatChordName(note, quality, chordType);

          const inversionsHTML = [0, 1, 2].map(inv => {
            const voicing = calculateTriadVoicing(note, quality, stringSet, inv, chordType);
            return `
              <div class="inversion-item">
                <div class="chord-inversion">${voicing.inversionName}</div>
                ${drawTriadDiagram(voicing)}
              </div>
            `;
          }).join('');

          card.innerHTML = `
            <div class="chord-name">${displayName}</div>
            <div class="chord-numeral">${romans[degree]}</div>
            <div class="inversion-row">${inversionsHTML}</div>
          `;
          row.appendChild(card);
        });
      } else {
        const region = selectedRegion;
        document.getElementById('mode-label').textContent = `Frets ${region.lo}–${region.hi}`;

        let anyFound = false;

        // For every diatonic chord, always show all four string sets, in
        // string-set order — one fragment each, even when a string set has no
        // playable voicing in this region (drawTriadDiagram(null) renders that
        // fragment as an empty "No voicing" placeholder). When a string set
        // has more than one inversion that fits, keep whichever sits lowest.
        scaleChords.forEach((chord, degree) => {
          const { note, quality } = chord;

          if (isSus && !isDiatonicSusChord(noteIndex(note), chordType, scalePcSet)) return;

          const voicingsByStringSet = STRING_SET_ORDER.map(stringSet => {
            const candidates = [0, 1, 2]
              .map(inv => findChordVoicingInRegion(note, quality, stringSet, inv, chordType, region.lo, region.hi))
              .filter(Boolean);
            if (candidates.length === 0) return null;

            candidates.sort((a, b) => {
              const aMin = Math.min(...a.frets.filter(f => f > 0), Infinity);
              const bMin = Math.min(...b.frets.filter(f => f > 0), Infinity);
              if (aMin !== bMin) return aMin - bMin;
              return a.inversion - b.inversion;
            });
            return candidates[0];
          });

          if (voicingsByStringSet.every(v => !v)) return;
          anyFound = true;

          const card = document.createElement('div');
          card.className = 'chord-card';
          card.style.animationDelay = `${degree * 0.06}s`;

          const displayName = formatChordName(note, quality, chordType);

          const voicingsHTML = voicingsByStringSet.map(voicing => `
            <div class="inversion-item">
              <div class="chord-inversion">${voicing ? voicing.inversionName : ''}</div>
              ${drawTriadDiagram(voicing)}
            </div>
          `).join('');

          card.innerHTML = `
            <div class="chord-name">${displayName}</div>
            <div class="chord-numeral">${romans[degree]}</div>
            <div class="inversion-row">${voicingsHTML}</div>
          `;
          row.appendChild(card);
        });

        if (!anyFound) {
          row.innerHTML = `<div class="no-chord" style="width:auto;padding:24px 32px;">No ${typeLabel.toLowerCase()} from this key fall within the selected region.</div>`;
        }
      }
    }

    // ── Init ───────────────────────────────────────────────────────────────────────

    document.querySelectorAll('input[name="chord-type"]').forEach(input => {
      input.addEventListener('change', generate);
    });

    renderCircle();
    generate();
  </script>
</body>
