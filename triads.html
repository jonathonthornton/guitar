  <meta charset="UTF-8">

  <title>Triads and Scales by Position</title>
  <meta name="description" content="Find every diatonic triad's 1-3-5 triad shape in a key that falls within a chosen neighbourhood of the fretboard. Pick a key and a 4-fret region from the nut to the 15th fret, and see the CAGED-style arpeggio shape for each scale degree playable there.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e1a'/%3E%3Cline x1='7' y1='24' x2='25' y2='8' stroke='%23223050' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='23' r='2.6' fill='%23e0a940'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23e0a940'/%3E%3Ccircle cx='24' cy='9' r='2.6' fill='%23e0a940'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    html {
      zoom: 1.1;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(224, 169, 64, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(166, 122, 46, 0.06) 0%, transparent 50%);
    }

    /* footer's align-self:stretch (needed because this page's body is a
       centering flexbox) comes from theme.css. */

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 300px) minmax(280px, 1fr);
      grid-template-areas:
        "key   stave"
        "key   region";
      column-gap: 40px;
      row-gap: 32px;
      margin-bottom: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px 32px;
      border-radius: 4px;
      width: 100%;
      max-width: 900px;
    }

    @media (max-width: 700px) {
      .controls {
        grid-template-columns: 1fr;
        grid-template-areas:
          "key"
          "stave"
          "region";
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group.control-key { grid-area: key; }
    .control-group.control-stave { grid-area: stave; }
    .control-group.control-region { grid-area: region; }

    .control-group.control-key label {
      text-align: center;
    }

    /* #key-label comes from theme.css (shared with chords.html/
       triad-position.html). #region-label is page-specific (id). */

    #region-label {
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 40px;
    }

    /* ── Per-degree arpeggio groups ───────────────────────────────────────────── */
    /* .shapes-grid, .diagram-card.shape-card, .shape-title, .fretboard-scroll,
       .chord-name, .chord-numeral, .notes-row, .note-badge, .legend-panel,
       .legend-title, .legend, .legend-item, .legend-dot, and .no-chord come
       from theme.css. */

    #arpeggio-groups {
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
    }

    .arpeggio-group {
      margin-bottom: 40px;
      animation: fadeUp 0.4s ease both;
    }

    .arpeggio-group:last-child {
      margin-bottom: 0;
    }

    .arpeggio-group-header {
      margin-bottom: 16px;
    }

    .chord-title-row {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 8px;
    }

    /* ── Circle of fifths (key selector) ─────────────────────────────────────── */

    .circle-container {
      display: flex;
      justify-content: center;
    }

    #circle-of-fifths {
      width: 100%;
      max-width: 280px;
      height: auto;
    }

    /* .circle-segment's base + major/minor hover/selected states, and
       .circle-text, come from theme.css. */

    /* ── Fret region picker ──────────────────────────────────────────────────── */

    .region-picker {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .region-picker .neck-wrap {
      position: relative;
      max-width: 340px; /* matches #key-stave's max-width (theme.css) */
      width: 100%;
    }

    .region-picker svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .region-segment {
      cursor: pointer;
    }

    .region-segment rect.region-fill {
      fill: transparent;
      stroke: transparent;
      transition: fill 0.15s ease, stroke 0.15s ease;
    }

    /* A translucent gold wash alone reads as muddy brown once it's blended
       with the dark navy neck behind it — a crisp gold border keeps the
       highlight unambiguously gold at a glance. */
    .region-segment:hover rect.region-fill {
      fill: rgba(224, 169, 64, 0.22);
      stroke: #e0a940;
      stroke-width: 1.5;
    }

    .region-segment.selected rect.region-fill {
      fill: rgba(224, 169, 64, 0.38);
      stroke: #e0a940;
      stroke-width: 1.25;
    }

    .region-segment text {
      fill: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      text-anchor: middle;
      pointer-events: none;
      transition: fill 0.15s ease;
    }

    .region-segment.selected text {
      fill: var(--amber);
    }

    .region-picker .readout {
      margin-top: 8px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      min-height: 20px;

      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: var(--amber);

<body>
  <a href="index.html" class="back-link">&larr; Toolkit Home</a>

  <header>
    <h1>Triads and Scales</h1>
    <p>Triads and scales in a key by fretboard region</p>
  </header>

  <div class="controls">
    <div class="control-group control-key">
      <label>Key</label>
      <div class="circle-container">
        <svg id="circle-of-fifths" width="400" height="400" viewBox="0 0 400 400"></svg>
      </div>
    </div>
    <div class="control-group control-stave">
      <label>Staff</label>
      <div class="stave-container">
        <svg id="key-stave" viewBox="10 0 550 173.33"></svg>
        <div class="stave-label" id="stave-label"></div>
      </div>
    </div>
    <div class="control-group control-region">
      <label>Fretboard Region</label>
      <div class="region-picker">
        <div class="neck-wrap">
          <svg id="neck" viewBox="13 0 287 90" xmlns="http://www.w3.org/2000/svg">

            <!-- ===== neck base ===== -->
            <rect x="20" y="23" width="260" height="34" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

            <!-- ===== fret ticks ===== -->
            <g id="fretTicks"></g>

            <!-- ===== position markers ===== -->
            <g id="positionMarkers"></g>

            <!-- ===== nut ===== -->
            <rect x="15" y="18" width="5" height="44" fill="var(--cream)"/>

            <!-- ===== region overlays (clickable) ===== -->
            <g id="regions"></g>

          </svg>
        </div>
        <div class="readout">
          <span class="value" id="regionReadout">Open – 3rd fret</span>
        </div>
      </div>
    </div>
  </div>

  <div id="key-label"></div>
  <div id="region-label"></div>
  <div id="arpeggio-groups"></div>

  <!-- Colors match DEGREE_COLORS/DEFAULT_TONE_COLOR below exactly — these
       are the same fretboard note colors the shape diagrams themselves use. -->
  <div class="legend-panel">
    <div class="legend-title">Legend</div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#e8b62d"></div>Root</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3cb2e3"></div>3rd</div>
      <div class="legend-item"><div class="legend-dot" style="background:#a95a1e"></div>5th</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e33c3c"></div>Diminished 5th</div>
      <div class="legend-item"><div class="legend-dot" style="background:#6e677e"></div>Scale tone</div>
    </div>
  </div>

  <footer>Designed by Jon Thornton. Implemented by Claude.</footer>

  <script src="lib/svg-utils.js"></script>
  <script src="lib/theory.js"></script>
  <script src="lib/triads.js"></script>
  <script src="lib/circle-of-fifths.js"></script>
  <script src="lib/stave.js"></script>
  <script src="lib/region-picker.js"></script>
  <script src="lib/fretboard.js"></script>
  <script>
    // ── Note helpers ──────────────────────────────────────────────────────────────
    // NOTES, LETTERS, LETTER_SEMITONE, and noteIndex come from theory.js.
    // spellChordTone, TRIAD_INTERVALS, KEYSTR_MAP, getKeyRoot, getScaleChords,
    // MAJOR_QUALITIES/MINOR_QUALITIES, ROMAN_MAJOR/ROMAN_MINOR, and
    // formatChordName come from lib/triads.js. pentatonicBoxes,
    // addOutOfBoxNote, diatonicBoxFromPentatonicBox, fillWindow,
    // finalizeShape, and renderShape come from lib/fretboard.js.

    // ── Circle of Fifths (Key selector) ──────────────────────────────────────────

    let selectedKey = 'C';
    let selectedKeyType = 'major';

    function renderCircle() {
      renderCircleOfFifths({
        selectedKey,
        selectedKeyType,
        onSelect: (name, type) => selectKey(name, type),
        onHover: (name, type) => renderStave(name, type),
        onHoverEnd: () => renderStave(selectedKey, selectedKeyType),
      });
    }

    function selectKey(keyName, keyType) {
      selectedKey = keyName;
      selectedKeyType = keyType;
      renderCircle();
      renderStave(keyName, keyType);
      generate();
    }

    // ── Staff ──────────────────────────────────────────────────────────────────
    // ROOT_SPELLING_MAJOR/MINOR, buildDiatonicScale, formatSpelledNote,
    // absoluteStaffStep, and getKeySignature come from theory.js.
    // renderMusicStave (and the stepY/drawLedgerLines it uses internally)
    // comes from lib/stave.js, which calls back into this page's own
    // degreeColor(index, degreeNames) (defined above) to color each notehead
    // exactly like the shape diagrams' dots.

    // Octave-assigned notes for the selected key's own plain diatonic scale
    // (major/Ionian or natural minor/Aeolian) — same octave-tracking
    // algorithm modes.html/scales.html use for their own staves: start the
    // tonic at octave 4 and bump the octave whenever the diatonic letter
    // sequence wraps around (e.g. B -> C).
    function keyStaffNotes(keyName, keyType) {
      const table = keyType === 'minor' ? ROOT_SPELLING_MINOR : ROOT_SPELLING_MAJOR;
      const [letter, accidental] = table[keyName];
      const formula = keyType === 'minor' ? MINOR_SCALE_INTERVALS : MAJOR_SCALE_INTERVALS;
      const diatonic = buildDiatonicScale(letter, accidental, formula);

      let octave = 4;
      let prevLetterIdx = null;
      return diatonic.map(entry => {
        const letterIdx = LETTER_INDEX[entry.letter];
        if (prevLetterIdx !== null && letterIdx < prevLetterIdx) octave++;
        prevLetterIdx = letterIdx;
        return {
          letter: entry.letter,
          accidental: entry.accidental,
          octave,
          name: formatSpelledNote(entry),
          step: absoluteStaffStep(entry.letter, octave),
        };
      });
    }

    function renderStave(keyName, keyType) {
      const sig = getKeySignature(keyName, keyType);
      const notes = keyStaffNotes(keyName, keyType);
      const scaleIntervals = keyType === 'minor' ? MINOR_SCALE_INTERVALS : MAJOR_SCALE_INTERVALS;
      const degreeNames = scaleIntervals.map(iv => SEMITONE_DEGREE_NAMES[iv]);

      renderMusicStave({
        sig,
        notes,
        degreeNames,
        getLabelLines: () => {
          const symbol = sig.type === 'sharp' ? '♯' : '♭';
          const count = sig.letters.length;
          const sigLine = count === 0 ? 'No sharps or flats'
            : `${count} ${sig.type}${count > 1 ? 's' : ''}: ${sig.letters.map(l => l + symbol).join(' ')}`;
          const modeLabel = keyType === 'major' ? 'Major' : 'Minor';
          return [`${sig.tonicName} ${modeLabel}`, sigLine];
        },
      });
    }

    // ── Fret region picker ───────────────────────────────────────────────────────
    // REGIONS, buildRegionPicker, and paintRegionPicker come from
    // lib/region-picker.js.

    let selectedRegion = REGIONS[0];

    buildRegionPicker({
      onSelect: (region) => {
        selectedRegion = region;
        paintRegionPicker(selectedRegion);
        generate();
      }
    });
    paintRegionPicker(selectedRegion);

    // ── Scale-tone colors ────────────────────────────────────────────────────────
    // Mirrors scales.html's Triad-type palette exactly (same visual language
    // for "fretboard note colours"), plus 'b5' for the diminished degrees
    // (vii° in a major key, ii° in a minor key) that scales.html's own
    // single-quality Triad type never needs to show. Every other scale
    // degree (2, 4, 6, 7, and their flat variants) falls through to
    // DEFAULT_TONE_COLOR — the pentatonic/diatonic views need those too,
    // the arpeggio (root/3rd/5th only) never does.
    const DEGREE_COLORS = {
      'Root': '#e8b62d',
      '3':    '#3cb2e3',
      'b3':   '#3cb2e3',
      '5':    '#a95a1e',
      'b5':   '#e33c3c',
    };
    const DEFAULT_TONE_COLOR = '#6e677e';

    function degreeColor(index, degreeNames) {
      return DEGREE_COLORS[degreeNames[index]] || DEFAULT_TONE_COLOR;
    }

    // Semitone distance from a scale's own root -> that degree's name, e.g.
    // interval 3 is always "b3" regardless of which scale it's part of.
    // Lets arpeggio/pentatonic/diatonic all derive degree names generically
    // from their interval formulas instead of needing one lookup table per
    // scale type.
    const SEMITONE_DEGREE_NAMES =
      ['Root', 'b2', '2', 'b3', '3', '4', 'b5', '5', 'b6', '6', 'b7', '7'];

    // Pitch classes, correctly-spelled note names, and the noteInfo lookup
    // finalizeShape()/makeDot() expect, for a scale built from `rootNote`
    // with the given chromatic interval formula. letterOffsets says how many
    // letters up the musical alphabet each interval's spelling should land
    // (0,2,4 for a triad's R-3-5; 0,1,2,4,5 for a major pentatonic's
    // R-2-3-5-6, skipping the 4th and 7th; etc).
    function buildScaleNoteInfo(rootNote, intervals, letterOffsets) {
      const rootPc = noteIndex(rootNote);
      const chromaticNotes = intervals.map(iv => NOTES[(rootPc + iv) % 12]);
      const spelledNames = intervals.map((iv, idx) =>
        spellChordTone(rootNote, letterOffsets[idx], (rootPc + iv) % 12));
      const degreeNames = intervals.map(iv => SEMITONE_DEGREE_NAMES[iv]);

      const noteInfo = {};
      chromaticNotes.forEach((note, i) => {
        noteInfo[note] = {
          note: spelledNames[i],
          isRoot: i === 0,
          color: degreeColor(i, degreeNames),
        };
      });

      return { rootPc, chromaticNotes, noteInfo };
    }

    const PENTATONIC_INTERVALS = { maj: [0, 2, 4, 7, 9], min: [0, 3, 5, 7, 10] };
    const PENTATONIC_LETTER_OFFSETS = { maj: [0, 1, 2, 4, 5], min: [0, 2, 3, 4, 6] };

    const DIATONIC_INTERVALS = { maj: MAJOR_SCALE_INTERVALS, min: MINOR_SCALE_INTERVALS };
    const DIATONIC_LETTER_OFFSETS = [0, 1, 2, 3, 4, 5, 6];

    // ── Arpeggio shapes ───────────────────────────────────────────────────────────

    // The five CAGED-box 1-3-5 arpeggio shapes for one chord root — the same
    // positional system scales.html uses for its Triad type, just built for
    // a single scale degree's root/quality rather than the whole key's tonic.
    // Returns the shapes alongside the chromaticNotes/noteInfo they were
    // built from, so a caller that needs a fallback position outside the
    // five canonical boxes (findWindowScale) can reuse the same note info.
    //
    // Takes the same pre-computed `boxes` (pentatonicBoxes(rootPc, isMajor))
    // that computePentatonicShapes/computeDiatonicShapes are given for this
    // degree, and forces every shape's anchor to that box's own anchor
    // (rather than letting finalizeShape derive it from whichever notes
    // survived the arpeggio's own sparser 3-note filter). Without this, a
    // box whose string-0 note isn't one of the triad's three tones would
    // report a different — often higher — anchor than its sibling
    // pentatonic/diatonic shapes at the very same box index, even though
    // all three represent the same physical hand position.
    //
    // A diminished triad's 5th (b5) is a tritone from the root, so — like
    // scales.html's blues b5 — it's never one of the minor-pentatonic box's
    // own notes and a plain box-filter would silently drop it.
    // addOutOfBoxNote (fretboard.js) reaches for it the same way blues does:
    // root and b3 come from the box directly, b5 is added afterward.
    function computeArpeggioShapes(rootNote, quality, boxes) {
      const { chromaticNotes, noteInfo } =
        buildScaleNoteInfo(rootNote, TRIAD_INTERVALS[quality], [0, 2, 4]);

      const shapes = boxes.map((box, idx) => {
        let frets = box.frets.map((stringFrets, s) =>
          stringFrets.filter(f => chromaticNotes.includes(getFretNote(s, f))));
        if (quality === 'dim') frets = addOutOfBoxNote(frets, chromaticNotes[2]);
        return finalizeShape(frets, noteInfo, idx, box.anchor);
      });
      return { shapes, chromaticNotes, noteInfo };
    }

    // The five CAGED-box shapes for the pentatonic scale matching a chord's
    // own quality — major pentatonic for a major-quality degree, minor
    // pentatonic for minor or diminished (both already anchor on the same
    // minor-pentatonic box the arpeggio itself uses for those qualities).
    function computePentatonicShapes(rootNote, quality, boxes) {
      const pentQuality = quality === 'maj' ? 'maj' : 'min';
      const { chromaticNotes, noteInfo } = buildScaleNoteInfo(
        rootNote, PENTATONIC_INTERVALS[pentQuality], PENTATONIC_LETTER_OFFSETS[pentQuality]);
      const shapes = boxes.map((box, idx) => finalizeShape(box.frets, noteInfo, idx, box.anchor));
      return { shapes, chromaticNotes, noteInfo };
    }

    // The five CAGED-box shapes for this chord root's own 7-note diatonic
    // scale — major (Ionian) for a major-quality degree, natural minor
    // (Aeolian) for minor or diminished — matching the same root+quality
    // basis the Arpeggio and Pentatonic cards already use, rather than the
    // parent key's own mode at this degree. The two aren't always the same
    // set of notes: e.g. for the IV chord of A major (D major), the parent
    // key's own mode is D Lydian (G#, borrowed from A major's own 7th
    // degree), while D's own major scale has a natural G. Building each
    // view from the chord's own root+quality keeps all three cards for a
    // degree consistent instead of only the 7-note view drifting.
    function computeDiatonicShapes(rootNote, quality, boxes) {
      const scaleQuality = quality === 'maj' ? 'maj' : 'min';
      const { chromaticNotes, noteInfo } = buildScaleNoteInfo(
        rootNote, DIATONIC_INTERVALS[scaleQuality], DIATONIC_LETTER_OFFSETS);
      const shapes = boxes.map((box, idx) =>
        finalizeShape(diatonicBoxFromPentatonicBox(chromaticNotes, box), noteInfo, idx, box.anchor));
      return { shapes, chromaticNotes, noteInfo };
    }

    // Among the given shapes, returns the index of whichever one best fits
    // the region — the one with the least overhang beyond the region's own
    // fret bounds. Zero overhang means the shape sits entirely inside the
    // region, which always wins outright; short of that, the shape that
    // sticks out the least is preferred. A region can legitimately overlap
    // more than one of the five box positions (their spans aren't
    // disjoint), but showing several near-duplicate shapes for the same
    // degree is just clutter — this always resolves to a single best
    // candidate. Returns -1 if none of the shapes overlap the region's fret
    // range at all. Returning the index (rather than the shape itself) lets
    // the caller pick the matching pentatonic/diatonic shape at the exact
    // same box position, so all three views of a degree line up.
    function bestFitIndexInRegion(shapes, region) {
      let bestIdx = -1, bestOverflow = Infinity;
      shapes.forEach((shape, i) => {
        const overlaps = shape.maxFret >= region.lo && shape.minFret <= region.hi;
        if (!overlaps) return;
        const overflow = Math.max(0, region.lo - shape.minFret) + Math.max(0, shape.maxFret - region.hi);
        if (overflow < bestOverflow) { bestOverflow = overflow; bestIdx = i; }
      });
      return bestIdx;
    }

    // Falls back to a direct scan of every fret in [lo, hi] on every string
    // (fillWindow, from fretboard.js) rather than one of the five canonical
    // CAGED positions. Used for the Open region specifically: since
    // pentatonicBoxesForRoot deliberately never anchors a position at the
    // open string (see its own comment in fretboard.js), some roots have no
    // box position at all inside frets 0–3, even though a scale's notes are
    // plainly playable there. Works for any note set (arpeggio, pentatonic,
    // or diatonic) — chromaticNotes/noteInfo come from whichever of
    // buildScaleNoteInfo()/computeDiatonicShapes()'s own note-info building
    // the caller needs. Returns null if the scale genuinely has no notes
    // anywhere in [lo, hi] on any string.
    function findWindowScale(chromaticNotes, noteInfo, lo, hi) {
      const frets = fillWindow(chromaticNotes, lo, hi);
      if (!frets.some(stringFrets => stringFrets.length > 0)) return null;
      return finalizeShape(frets, noteInfo, 0);
    }

    // ── Generate ───────────────────────────────────────────────────────────────────

    function generate() {
      const keyStr = KEYSTR_MAP[selectedKey];
      const mode = selectedKeyType;
      const region = selectedRegion;

      const root = getKeyRoot(keyStr, mode);
      const scaleChords = getScaleChords(keyStr, mode);
      const romans = mode === 'major' ? ROMAN_MAJOR : ROMAN_MINOR;
      const modeLabel = mode === 'major' ? 'Major' : 'Minor';

      document.getElementById('key-label').textContent = `${root} ${modeLabel}`;
      document.getElementById('region-label').textContent =
        `Frets ${region.lo}–${region.hi}`;

      const container = document.getElementById('arpeggio-groups');
      container.innerHTML = '';

      let anyFound = false;

      // For every diatonic triad, keep whichever of its five CAGED-box
      // positions best fits the selected region (bestFitIndexInRegion),
      // then read the pentatonic and diatonic shapes off that exact same
      // box index, so all three views land on the same physical position.
      // If none overlap the region at all (most common for the Open region
      // — see findWindowScale), fall back to a direct scan of the region
      // itself for all three views; if even that finds nothing playable
      // there, fall back further to whichever canonical position sits
      // closest to the region, clearly labeled as an approximation. Only a
      // degree with literally no notes anywhere near the region is left out.
      scaleChords.forEach((chord, degree) => {
        const { note, quality } = chord;

        // Same five boxes underlie all three views of this degree — computing
        // them once and threading them through keeps every view's anchor
        // pinned to the same physical position (see computeArpeggioShapes).
        const boxes = pentatonicBoxes(noteIndex(note), quality === 'maj');
        const arpeggio = computeArpeggioShapes(note, quality, boxes);
        const pentatonic = computePentatonicShapes(note, quality, boxes);
        const diatonic = computeDiatonicShapes(note, quality, boxes);

        let views = null;

        const bestIdx = bestFitIndexInRegion(arpeggio.shapes, region);
        if (bestIdx >= 0) {
          const a = arpeggio.shapes[bestIdx];
          views = {
            arpeggioShape: a,
            pentatonicShape: pentatonic.shapes[bestIdx],
            diatonicShape: diatonic.shapes[bestIdx],
          };
        }

        if (!views && region.lo === 0) {
          const windowArpeggio = findWindowScale(arpeggio.chromaticNotes, arpeggio.noteInfo, region.lo, region.hi);
          if (windowArpeggio) {
            // Pentatonic/diatonic have more notes than the arpeggio, so
            // their own window scan should essentially always find
            // something too — the arpeggio's own shape is just a defensive
            // fallback for the (practically unreachable) case it doesn't.
            const windowPentatonic = findWindowScale(pentatonic.chromaticNotes, pentatonic.noteInfo, region.lo, region.hi);
            const windowDiatonic = findWindowScale(diatonic.chromaticNotes, diatonic.noteInfo, region.lo, region.hi);

            views = {
              arpeggioShape: windowArpeggio,
              pentatonicShape: windowPentatonic || windowArpeggio,
              diatonicShape: windowDiatonic || windowArpeggio,
            };
          }
        }

        if (!views) {
          // None of the five positions overlap the region at all (checked
          // by bestFitIndexInRegion above) — of those, pick whichever's
          // fret range sits closest to the region's own bounds, and read
          // pentatonic/diatonic off that same box index.
          let closestIdx = -1, closestGap = Infinity;
          arpeggio.shapes.forEach((shape, i) => {
            const gap = shape.maxFret < region.lo ? region.lo - shape.maxFret : shape.minFret - region.hi;
            if (gap < closestGap) { closestGap = gap; closestIdx = i; }
          });
          if (closestIdx >= 0) {
            const a = arpeggio.shapes[closestIdx];
            views = {
              arpeggioShape: a,
              pentatonicShape: pentatonic.shapes[closestIdx],
              diatonicShape: diatonic.shapes[closestIdx],
            };
          }
        }

        if (!views) return;
        anyFound = true;

        const displayName = formatChordName(note, quality);

        // Note-row badges for this degree's own 7-note diatonic scale (the
        // same notes as the Diatonic card), in the same style as
        // scales.html's per-scale note badges — colored to match the
        // fretboard dots (diatonic.noteInfo) and titled with each note's
        // scale-degree name.
        const diatonicScaleQuality = quality === 'maj' ? 'maj' : 'min';
        const diatonicDegreeNames = DIATONIC_INTERVALS[diatonicScaleQuality].map(iv => SEMITONE_DEGREE_NAMES[iv]);
        const noteBadgesHTML = buildNoteBadgesHTML(
          diatonic.chromaticNotes.map((chromaticNote, i) => ({
            name: diatonic.noteInfo[chromaticNote].note,
            color: diatonic.noteInfo[chromaticNote].color,
            title: diatonicDegreeNames[i],
          }))
        );

        const group = document.createElement('div');
        group.className = 'arpeggio-group';
        group.style.animationDelay = `${degree * 0.06}s`;

        const cards = [
          { title: 'Triads', shape: views.arpeggioShape },
          { title: 'Pentatonic', shape: views.pentatonicShape },
          { title: 'Diatonic', shape: views.diatonicShape },
        ];
        const shapesHTML = cards.map(({ title, shape }) => `
          <div class="diagram-card shape-card">
            <div class="shape-title">${title}</div>
            <div class="fretboard-scroll">${renderShape(shape)}</div>
          </div>
        `).join('');

        group.innerHTML = `
          <div class="arpeggio-group-header">
            <div class="chord-title-row">
              <div class="chord-name">${displayName}</div>
              <div class="chord-numeral">(${romans[degree]})</div>
            </div>
            <div class="notes-row">${noteBadgesHTML}</div>
          </div>
          <div class="shapes-grid">${shapesHTML}</div>
        `;
        container.appendChild(group);
      });

      if (!anyFound) {
        container.innerHTML = `<div class="no-chord" style="width:auto;padding:24px 32px;">No arpeggios from this key fall within the selected region.</div>`;
      }
    }

    // ── Init ───────────────────────────────────────────────────────────────────────

    renderCircle();
    renderStave(selectedKey, selectedKeyType);
    generate();
  </script>
</body>

</html>
